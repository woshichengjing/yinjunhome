<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 状态机全貌 — 香槟国际</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,system-ui,sans-serif;background:#0d1117;color:#c9d1d9}
.container{position:relative;z-index:1;max-width:1400px;margin:0 auto}
.container-grid{position:relative;z-index:1;padding:16px;margin-top:40vh}
h1{font-size:22px;color:#58a6ff;margin-bottom:4px}
.sub{color:#8b949e;font-size:12px;margin-bottom:16px}
.grid4{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px}
.card h2{font-size:14px;color:#58a6ff;border-bottom:1px solid #21262d;padding-bottom:6px;margin-bottom:8px}
.card h3{font-size:13px;color:#d2a8ff;margin:8px 0 4px}
.state-row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;border-bottom:1px solid #21262d33}
.state-label{color:#8b949e}
.state-value{font-weight:600}
.state-value.ok{color:#3fb950}
.state-value.warn{color:#d29922}
.state-value.bad{color:#f85149}
.state-value.info{color:#58a6ff}
.decision-box{padding:8px;border-radius:4px;margin:4px 0;font-size:12px}
.decision-box.ac_on{background:#1b3a1b;border-left:3px solid #3fb950}
.decision-box.ac_off{background:#3a1b1b;border-left:3px solid #f85149}
.decision-box.none{background:#1b1f2a;border-left:3px solid #484f58}
.all-states{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.state-badge{padding:2px 8px;border-radius:10px;font-size:11px;background:#21262d;color:#484f58;border:1px solid #30363d;white-space:nowrap}
.state-badge.active{background:#1b3a1b;color:#3fb950;border-color:#3fb950;font-weight:600}
/* 新版卡片式状态机（SVG图标驱动） */
.state-card{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #21262d}
.state-card:last-child{border-bottom:none}
.dev-box{border:1px solid #21262d;border-radius:4px;padding:7px 10px;font-size:11px;position:relative;display:inline-block;width:auto;min-width:90px;min-height:55px;height:55px}
.dev-box .dev-toggle{position:absolute;top:4px;right:4px}
.dev-box-row{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
.sc-icon{width:14px;height:14px;flex-shrink:0}
.sc-body{flex:1;min-width:0}
.sc-title{font-size:12px;font-weight:600;color:#c9d1d9}
.sc-state{font-size:14px;font-weight:700;margin-top:2px}
.sc-state.occ{color:#3fb950}
.sc-state.entering{color:#d29922}
.sc-state.empty{color:#8b949e}
.sc-info{font-size:10px;color:#8b949e;margin-top:2px}
.sc-badge{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:2px 6px;border-radius:4px;margin-right:4px}
.sc-badge.warn{background:rgba(210,153,34,0.15);color:#d29922}
.sc-badge.bad{background:rgba(248,81,73,0.15);color:#f85149}
.sc-badge.ok{background:rgba(63,185,80,0.15);color:#3fb950}
.sc-badge.info{background:rgba(88,166,255,0.15);color:#58a6ff}
.current-info{font-size:11px;color:#8b949e;margin-top:6px}
.reason-text{color:#c9d1d9;font-size:12px;margin-top:2px}


.refresh{font-size:11px;color:#8b949e;float:right}
/* Windy 地图卡片 */
.windy-card{margin:0 0 8px 0}
.windy-toolbar{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.windy-btn{padding:4px 12px;border-radius:10px;font-size:11px;border:1px solid #30363d;background:#21262d;color:#8b949e;cursor:pointer;transition:all .2s}
.windy-btn:hover{color:#c9d1d9;border-color:#58a6ff}
.windy-btn.active{background:#1b3a1b;color:#3fb950;border-color:#3fb950;font-weight:600}
.windy-card{position:fixed;top:0;left:0;width:100%;height:100vh;z-index:0;pointer-events:none;margin:0}
.windy-wrapper{position:relative;width:100%;height:100%}
.windy-map{width:100%;height:100%;border:none;display:block;pointer-events:none}
.windy-readings{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.windy-tip{position:absolute;top:6px;left:10px;max-width:calc(100% - 76px);background:rgba(22,27,34,0.92);color:#c9d1d9;font-size:12px;padding:5px 10px;border-radius:5px;border:1px solid #58a6ff44;z-index:10;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr-item{display:flex;flex-direction:row;align-items:center;gap:4px;background:#0d1117;border:1px solid #21262d;border-radius:5px;padding:3px 8px}
.wr-item .wr-label{font-size:10px;color:#8b949e}
.wr-item .wr-val{font-size:13px;font-weight:600;color:#c9d1d9}
.wr-item.hot .wr-val{color:#f85149}
.wr-item.cool .wr-val{color:#58a6ff}
.wr-section{font-size:10px;color:#8b949e;margin:8px 0 3px;border-top:1px solid #21262d;padding-top:6px}
.wr-src{display:inline-flex;align-items:center}
.wr-src svg{width:12px;height:12px;display:block}
.wr-src.qw{color:#79c0ff}
.wr-src.local{color:#56d364}
.emo{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.wr-dual{gap:5px}
.wr-dual .dv{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:600;color:#c9d1d9}
.wr-dual .dv.hot{color:#f85149}
.wr-dual .dv.cool{color:#58a6ff}
.src-ic{width:11px;height:11px;flex-shrink:0}
.src-ic.qw{color:#79c0ff}
.src-ic.local{color:#56d364}
.windy-overlay{position:absolute;right:10px;top:12%;display:flex;flex-direction:column;gap:4px;z-index:10;pointer-events:none;max-height:calc(100% - 100px);overflow:hidden}
.ov-item{display:inline-flex;align-items:center;gap:3px;background:rgba(13,17,23,0.5);color:#c9d1d9;font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px;border:1px solid #58a6ff33;backdrop-filter:blur(2px)}
.ov-item .wr-label{font-size:9px;font-weight:400;color:#9aa4af}
.weather-active .windy-overlay{pointer-events:none}
.weather-active .windy-tip{pointer-events:none}
/* 天气交互模式 */
.weather-back{position:fixed;bottom:24px;right:16px;z-index:25;display:none;align-items:center;gap:6px;padding:8px 16px;background:rgba(22,27,34,0.92);border:1px solid #58a6ff44;border-radius:20px;color:#c9d1d9;font-size:12px;cursor:pointer;backdrop-filter:blur(4px);transition:all .3s}
.weather-back:hover{background:rgba(27,59,27,0.9);border-color:#3fb950;color:#3fb950}
.weather-active .weather-back{display:flex}
.weather-active .windy-card{pointer-events:auto}
.weather-active .windy-map{pointer-events:auto}
.weather-active .container-grid{transform:translateY(100vh);transition:transform .4s cubic-bezier(.4,0,.2,1)}
.weather-active .container{overflow:hidden;pointer-events:none}
.env-swipe-hint{font-size:10px;color:#484f58;text-align:right;margin-top:4px}
.windy-click-layer{position:absolute;top:0;left:0;width:100%;height:50vh;z-index:5;cursor:pointer;pointer-events:auto}
.weather-active .windy-click-layer{display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

<button class="weather-back" id="weather-back" onclick="closeWeather()">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
返回
</button>

</div>
</div>

</div>

// 根据视口高度动态计算 Windy 中心，让杭州在屏幕顶到卡片顶之间居中
var HZ_LAT=30.25,HZ_LON=120.17;
function windLat(){
var vh=window.innerHeight;
var offset=1.7*(vh/800);
return (HZ_LAT-offset).toFixed(2);
}
function applyWindyCenter(){
var iframe=document.getElementById('windy-map');
if(!iframe)return;
var src=iframe.src;
var nlat=windLat();
if(src.indexOf('lat='+nlat)>=0)return;
iframe.src=src.replace(/lat=[\d.]+/,'lat='+nlat);
}
window.addEventListener('resize',function(){
clearTimeout(window._wct);window._wct=setTimeout(applyWindyCenter,300);
});

document.body.classList.add('weather-active');
document.body.style.overflow='hidden';
var el=document.querySelector('.container-grid');
if(el){el.style.transition='transform .4s cubic-bezier(.4,0,.2,1)';el.style.transform='translateY(100vh)';}
});
function closeWeather(){
document.body.classList.remove('weather-active');
document.body.style.overflow='';
var el=document.querySelector('.container-grid');

function aggregateHistory(history,period,now){
// period: hour(今日分时), day(7日), week(4周), month(30日)
var points=history; // [{ts, total_watts, devices:{id:{watts,runtime_sec}}}]
var deviceIds={}; // 收集所有出现过的设备
for(var i=0;i<points.length;i++){
var devs=points[i].devices||{};
for(var did in devs){deviceIds[did]=true;}
}
var dids=Object.keys(deviceIds);

var buckets={},bucketLabels=[];
var bucketSec,cutoff,bucketCount;

if(period==='hour'){
// 今日每小时
var d=new Date();d.setHours(0,0,0,0);cutoff=parseInt(d.getTime()/1000);
bucketSec=3600;bucketCount=24;
}else if(period==='day'){
cutoff=now-7*86400;bucketSec=86400;bucketCount=7;
}else if(period==='week'){
cutoff=now-28*86400;bucketSec=7*86400;bucketCount=4;
}else{ // month
cutoff=now-30*86400;bucketSec=86400;bucketCount=30;
}

// 初始化 buckets
for(var b=0;b<bucketCount;b++){
var t=cutoff+b*bucketSec;
buckets[t]={total:0};
for(var j=0;j<dids.length;j++)buckets[t][dids[j]]=0;
bucketLabels.push(t);
}

// 聚合（kWh = watts * (5*60/3600) / 1000 = watts / 12000）
var KWH_FACTOR=1/12000;
for(var i=0;i<points.length;i++){
var p=points[i];
if(p.ts<cutoff)continue;
var bt=cutoff+Math.floor((p.ts-cutoff)/bucketSec)*bucketSec;
if(!buckets[bt])continue;
buckets[bt].total+=p.total_watts*KWH_FACTOR;
var devs=p.devices||{};
for(var j=0;j<dids.length;j++){
buckets[bt][dids[j]]+=(devs[dids[j]]?devs[dids[j]].watts:0)*KWH_FACTOR;
}
}

// 转为 datasets
var totalData=[],deviceData={};
for(var j=0;j<dids.length;j++)deviceData[dids[j]]=[];

for(var b=0;b<bucketLabels.length;b++){
var bt=bucketLabels[b],bk=buckets[bt];
totalData.push(bk?Math.round(bk.total*100)/100:0);
for(var j=0;j<dids.length;j++){
deviceData[dids[j]].push(bk?Math.round(bk[dids[j]]*100)/100:0);
}
}

// 生成时间标签
var labels=[];
for(var b=0;b<bucketLabels.length;b++){
var ts=bucketLabels[b];
labels.push(formatBucketLabel(ts,period));
}

var datasets=[];
// 总计线（粗线）
datasets.push({
label:'总计',
icon:'📈',
data:totalData,
borderColor:'#d2a8ff',
backgroundColor:'rgba(210,168,255,0.1)',
borderWidth:2.5,
pointRadius:2,
pointHoverRadius:5,
tension:0.3,
fill:true
});
// 各设备线
for(var j=0;j<dids.length;j++){
var did=dids[j];
datasets.push({
label:DEV_NAMES[did]||did,
icon:DEV_ICONS[did]||'⚡',
data:deviceData[did],
borderColor:DEV_COLORS[j%DEV_COLORS.length],
backgroundColor:'transparent',
borderWidth:1.5,
pointRadius:1,
pointHoverRadius:3,
tension:0.3,
hidden:(j>=6) // 超过6个设备默认折叠
});
}

return{labels:labels,datasets:datasets};
}

function formatBucketLabel(ts,period){
var d=new Date(ts*1000);
if(period==='hour')return ('0'+d.getHours()).slice(-2)+':00';
if(period==='day'||period==='month')return (d.getMonth()+1)+'/'+d.getDate();
// week
var end=new Date((ts+7*86400)*1000);
return (d.getMonth()+1)+'/'+d.getDate()+'-'+(end.getMonth()+1)+'/'+end.getDate();
}

function drawChart(result,period){
var ctx=document.getElementById('ep-chart');
if(_energyChart){_energyChart.destroy();_energyChart=null;}

// 计算总计
var totalKwh=0;

var unit=period==='hour'?'今日累计':'期间累计';
document.getElementById('ep-summary').innerHTML=unit+' <span>'+totalKwh.toFixed(2)+' kWh</span>';

_energyChart=new Chart(ctx,{
type:'line',
data:{labels:result.labels,datasets:result.datasets},
options:{
responsive:true,
maintainAspectRatio:false,
interaction:{mode:'index',intersect:false},
plugins:{
legend:{display:false},
tooltip:{
backgroundColor:'#161b22',
titleColor:'#c9d1d9',
bodyColor:'#c9d1d9',
borderColor:'#30363d',
borderWidth:1,
callbacks:{
label:function(ctx){return ctx.dataset.label+': '+ctx.parsed.y.toFixed(2)+' kWh';}
}
}
},
scales:{
x:{
ticks:{color:'#8b949e',font:{size:10},maxTicksLimit:period==='hour'?8:period==='week'?4:7},
grid:{color:'#21262d'}
},
y:{
ticks:{color:'#8b949e',font:{size:10},callback:function(v){return v.toFixed(1)+' kWh';}},
grid:{color:'#21262d'}
}
}
}
});

function renderStandbyGrid(isWd){
fetch('/static/data/standby_schedule.json?t='+Date.now())
.then(function(r){if(!r.ok)throw Error('HTTP '+r.status);return r.json();})
.then(function(sched){
var schedule=sched.schedule||{};
var rooms=Object.keys(schedule);
if(!rooms.length){
document.getElementById('sb-grid').innerHTML='<div style="color:#484f58;padding:20px;text-align:center">暂无数据，需要累积5个同类型日样本后开始分析（每天凌晨3:00更新）</div>';
document.getElementById('sb-note').textContent='';
return;
}
// 筛选当前 is_workday
var data={};
for(var r=0;r<rooms.length;r++){
var entry=schedule[rooms[r]];
for(var i=0;i<entry.length;i++){
if(entry[i].is_workday===isWd){
if(!data[rooms[r]])data[rooms[r]]={};
data[rooms[r]][entry[i].hour]=entry[i].delay_min;
}
}
}
// 构建热力图网格
var roomOrder=['br','st','lr','nb','sb','kt','cr','gb','bath'];
var roomsInData=roomOrder.filter(function(r){return data[r];});
if(!roomsInData.length){
document.getElementById('sb-grid').innerHTML='<div style="color:#484f58;padding:20px;text-align:center">当前类型（'+(isWd?'工作日':'非工作日')+'）暂无数据</div>';
document.getElementById('sb-note').textContent='';
return;
}
var gridHTML='';
// 表头行
gridHTML+='<div class="sb-cell hdr room"></div>';
for(var h=0;h<24;h++){
gridHTML+='<div class="sb-cell hdr">'+h+'</div>';
}
// 每行一个房间
for(var ri=0;ri<roomsInData.length;ri++){
var rk=roomsInData[ri];
gridHTML+='<div class="sb-cell room">'+EMO((ROOM_NAMES_SB[rk]||rk))+'</div>';
for(var h=0;h<24;h++){
var d=data[rk][h];
var cls='tnone',label='';
if(d===15){cls='t15';label='15m';}
else if(d===30){cls='t30';label='30m';}
else if(d===60){cls='t60';label='60m';}
else if(d===120){cls='t120';label='2h';}
gridHTML+='<div class="sb-cell '+cls+'" title="'+(ROOM_NAMES_SB[rk]||rk)+' '+h+':00'+(label?' - '+label:' - 无数据')+'">'+(label||'')+'</div>';
}
}
// 设置grid列数
var gridEl=document.getElementById('sb-grid');
gridEl.style.gridTemplateColumns='auto '+Array(24).fill('1fr').join(' ');
gridEl.innerHTML=gridHTML;
document.getElementById('sb-note').textContent=sched.ts?'更新于 '+sched.ts:'';
})
.catch(function(e){
document.getElementById('sb-grid').innerHTML='<div style="color:#f85149;padding:20px;text-align:center">加载失败: '+e.message+'</div>';
});
}

// 构建表格：行=房间, 列=工作日/非工作日时间段

var h=e.hour,sm=e.start_min;

function setRdTab(act){var tb=document.querySelectorAll('#rd-tabs button');for(var ti=0;ti<tb.length;ti++)tb[ti].classList.remove('active');for(var tj=0;tj<tb.length;tj++){if(tb[tj].textContent.indexOf(act)>=0)tb[tj].classList.add('active');}}
function renderRoomEnergy(rk){
  if(window._rdChart){window._rdChart.destroy();window._rdChart=null;}setRdTab('能耗');
  var devs=ROOM_DEV_MAP[rk]||[];
  fetch('/static/data/state_energy_history.json?t='+Date.now()).then(function(r){return r.json()}).then(function(history){
    if(!history||!history.length){document.getElementById('rd-content').innerHTML='暂无数据';return;}
    var d=new Date();d.setHours(0,0,0,0);var cutoff=parseInt(d.getTime()/1000);
    var buckets={};for(var h=0;h<24;h++){buckets[h]=0;}
    for(var i=0;i<history.length;i++){
      var p=history[i];if(p.ts<cutoff)continue;var hh=new Date(p.ts*1000).getHours();
      if(!devs.length)buckets[hh]+=(p.total_watts||0)/1000;
      else{var dd=p.devices||{};for(var j=0;j<devs.length;j++){var dv=dd[devs[j]];if(dv)buckets[hh]+=(dv.watts||0)/1000;}}
    }
    var labels=[],vals=[];for(var h=0;h<24;h++){labels.push(h+'时');vals.push((buckets[h]||0).toFixed(2));}
    var maxV=0,total=0;for(var k=0;k<vals.length;k++){var v=parseFloat(vals[k]);if(v>maxV)maxV=v;total+=v;}
    document.getElementById('rd-content').innerHTML='<canvas id="rd-chart" style="max-height:300px"></canvas><div style="font-size:12px;color:#8b949e;text-align:center;margin-top:8px">今日估算：<span style="color:#d2a8ff;font-weight:600">'+total.toFixed(3)+' kWh</span></div>';
    window._rdChart=new Chart(document.getElementById('rd-chart').getContext('2d'),{type:'bar',data:{labels:labels,datasets:[{label:'kW',data:vals,backgroundColor:'rgba(88,166,255,0.4)',borderColor:'rgba(88,166,255,0.8)',borderWidth:1}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,ticks:{color:'#8b949e'}},x:{ticks:{color:'#8b949e'}}},plugins:{legend:{labels:{color:'#c9d1d9'}}}}});
  });
}
function renderRoomStandby(rk){
  if(window._rdChart){window._rdChart.destroy();window._rdChart=null;}setRdTab('待机');
  fetch('/static/data/standby_schedule.json?t='+Date.now()).then(function(r){return r.json()}).then(function(sched){
    var entry=(sched.schedule||{})[rk];
    if(!entry||!entry.length){document.getElementById('rd-content').innerHTML='<div style="text-align:center;color:#484f58;padding:40px">暂无待机数据</div>';return;}
    var wdData={},nwdData={};
    for(var i=0;i<entry.length;i++){if(entry[i].is_workday)wdData[entry[i].hour]=entry[i].delay_min;else nwdData[entry[i].hour]=entry[i].delay_min;}
    function buildRow(data,label){
      var htm='<tr><td style="padding:3px 4px;color:#8b949e">'+label+'</td>';
      for(var h=0;h<24;h++){
        var v=data[h];var bg='',cl='';
        if(v){var alpha=Math.min(1,Math.max(0.15,v/120));bg='background:rgba(210,153,34,'+alpha.toFixed(2)+')';cl='color:#c9d1d9';}
htm+='<td style="padding:2px 3px;font-size:9px;text-align:center;'+bg+';'+cl+'">'+(v||'120')+'</td>';
      }
      htm+='</tr>';return htm;
    }
    var html='<div style="font-size:12px;color:#8b949e;margin-bottom:10px">动态待机延迟（分钟）</div>';
    html+='<table style="width:100%;border-collapse:collapse;font-size:11px">';
    html+='<tr><th style="padding:4px;color:#8b949e;border-bottom:1px solid #30363d"></th>';
    for(var h=0;h<24;h++)html+='<th style="padding:3px;color:#484f58;font-size:9px">'+h+'</th>';
    html+='</tr>';
    html+=buildRow(wdData,'工作日');
    html+=buildRow(nwdData,'非工作日');
    html+='</table>';
    document.getElementById('rd-content').innerHTML=html;
  });
}
function renderRoomPrecool(rk){
  if(window._rdChart){window._rdChart.destroy();window._rdChart=null;}setRdTab('舒适');

    function buildRow(data,label){
      var htm='<tr><td style="padding:3px 4px;color:#8b949e">'+label+'</td>';
      for(var h=0;h<24;h++){
        var v=data[h];var bg='',cl='',txt='';

      }
      htm+='</tr>';return htm;
    }
    var html='<div style="font-size:12px;color:#8b949e;margin-bottom:10px">预冷/预热计划</div>';
    html+='<table style="width:100%;border-collapse:collapse;font-size:11px">';
    html+='<tr><th style="padding:4px;color:#8b949e;border-bottom:1px solid #30363d"></th>';
    for(var h=0;h<24;h++)html+='<th style="padding:3px;color:#484f58;font-size:9px">'+h+'</th>';
    html+='</tr>';
    html+=buildRow(wdData,'工作日');
    html+=buildRow(nwdData,'非工作日');
    html+='</table>';
    document.getElementById('rd-content').innerHTML=html;
  });
}
